[package]
name = "sql-fingerprint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"

[dev-dependencies]
criterion = "0.7.0"

[lints.clippy]
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"

[[bench]]
name = "fingerprint"
harness = false
